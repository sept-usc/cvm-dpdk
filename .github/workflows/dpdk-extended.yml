name: DPDK extended software tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install optional software test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config libnuma-dev libssl-dev libipsec-mb-dev libelf-dev libpcap-dev clang xxd python3-pyelftools
      - name: Verify release and apply the full patch series
        run: |
          curl --fail --location --retry 3 https://fast.dpdk.org/rel/dpdk-25.11.3.tar.xz -o "$RUNNER_TEMP/dpdk.tar.xz"
          echo "$(cat patches/dpdk-25.11.3/RELEASE_SHA256)  $RUNNER_TEMP/dpdk.tar.xz" | sha256sum --check
          mkdir "$RUNNER_TEMP/dpdk"
          tar -xf "$RUNNER_TEMP/dpdk.tar.xz" -C "$RUNNER_TEMP/dpdk" --strip-components=1
          git -C "$RUNNER_TEMP/dpdk" init
          git -C "$RUNNER_TEMP/dpdk" config user.name 'keke1022'
          git -C "$RUNNER_TEMP/dpdk" config user.email 'keke83space@gmail.com'
          git -C "$RUNNER_TEMP/dpdk" add -f .
          git -C "$RUNNER_TEMP/dpdk" commit -m 'Import verified DPDK 25.11.3 release'
          bash scripts/apply-dpdk-patches.sh "$RUNNER_TEMP/dpdk"
      - name: Build optional software PMDs and upstream tests
        run: |
          meson setup "$RUNNER_TEMP/dpdk-build" "$RUNNER_TEMP/dpdk" \
            -Dtests=true -Ddefault_library=static -Dplatform=generic \
            '-Denable_drivers=bus/*,mempool/ring,net/null,net/ring,net/vhost,event/skeleton,event/dsw,crypto/openssl,crypto/ipsec_mb,crypto/scheduler' \
            -Denable_apps=test
          ninja -C "$RUNNER_TEMP/dpdk-build" -j 2
      - name: Scheduler, crypto, BPF ELF, dispatcher, pcapng and RX interrupts
        run: bash scripts/test-dpdk-extended.sh "$RUNNER_TEMP/dpdk-build"
      - name: Retain test results and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpdk-extended-logs
          path: |
            ${{ runner.temp }}/dpdk-build/meson-logs/
            ${{ runner.temp }}/dpdk-build/cvm-dpdk-extended-tests/
